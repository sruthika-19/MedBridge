<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MedBridge - Enterprise EMR Integration</title>
        <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='42' fill='%23050508' stroke='%2300e5ff' stroke-width='6'/><path d='M20 50 L35 50 L45 25 L60 75 L70 50 L80 50' stroke='%232979ff' stroke-width='8' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
        <link rel="stylesheet" href="style.css">
    </head>

    <body class="dark-theme">
    <div class="container mt-4 mb-5" style="max-width: 1200px;">
        
        <div class="text-center mb-5">
            <h1 class="display-4 fw-bold gradient-text mb-2">MedBridge EMR</h1>
            <p class="subtitle-text">Enterprise Interoperability Gateway</p>
        </div>

        <div class="row g-4">
            
            <div class="col-lg-7">
                <div class="search-wrapper glass-panel p-2 mb-4 shadow-lg">
                    <div class="d-flex gap-2 align-items-center">
                        <input type="text" id="diseaseInput" class="form-control form-control-lg custom-input" placeholder="Enter Diagnosis">
                        <button class="btn icon-btn" id="micButton" title="Voice Search" type="button">🎙️</button>
                        <button class="btn btn-primary search-btn shadow-sm px-4 fw-bold" id="searchButton" type="button">Search</button>
                    </div>
                </div>

                <div id="result"></div>
            </div>

            <div class="col-lg-5">
                
                <div class="glass-panel p-4 text-center mb-4" style="border: 2px dashed var(--accent-cyan);">
                    <h4 class="emr-title mb-2">Enterprise Bulk Migration</h4>
                    <p class="text-muted mb-3" style="font-size: 0.9rem;">Upload legacy hospital data (.csv) to instantly map thousands of records to WHO ICD-11 standards.</p>
                    
                    <div class="custom-file-upload mb-4">
                        <input type="file" id="csvFileInput" accept=".csv" class="d-none">
                        <label for="csvFileInput" class="file-upload-box w-100 p-4 text-center rounded shadow-sm" id="dropZone">
                            <div class="mb-2" style="font-size: 2rem;">📁</div>
                            <h6 class="mb-1 fw-bold text-light">Drag & Drop your legacy data</h6>
                            <p class="text-muted small mb-0">or click to browse (.csv only)</p>
                            <div id="fileNameDisplay" class="mt-3 fw-bold upload-success-text d-none"></div>
                        </label>
                    </div>
                    
                    <button type="button" id="bulkUploadBtn" class="btn btn-primary search-btn px-4 fw-bold w-100">
                        ⚡ Process Bulk Data
                    </button>
                    <div id="bulkResult" class="mt-3 fw-bold text-success"></div>
                </div>

                <!-- API Integration Demo Area -->
                <div id="emrIntegration"></div>
                
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
