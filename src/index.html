<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MedBridge - Clinician Portal</title>
        
    <!--<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    -->
        <link rel="manifest" href="/src/manifest.json">
        <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='42' fill='%23050508' stroke='%2300e5ff' stroke-width='6'/><path d='M20 50 L35 50 L45 25 L60 75 L70 50 L80 50' stroke='%232979ff' stroke-width='8' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="/src/style.css">
    </head>

    <body class="dark-theme">
    <div class="container mt-4 mb-5" style="max-width: 1200px;">
        
        <nav class="navbar navbar-expand-lg navbar-dark glass-panel mb-4 px-4 py-3" style="border-radius: 15px !important;">
            <div class="container-fluid">
                <a class="navbar-brand fw-bold gradient-text" href="index.html">MedBridge EMR</a>
                <div class="navbar-nav ms-auto gap-3 align-items-center">
                    <a class="nav-link text-info fw-semibold" href="index.html">🩺 Clinician Portal</a>
                    <a class="nav-link text-light fw-semibold" href="admin.html">🛡️ Hospital Admin</a>
                    <button id="signOutBtn" class="btn btn-sm btn-outline-danger px-3 py-1 fw-bold" onclick="handleSignOut(event)">Sign Out</button>
                </div>
            </div>
        </nav>

        <div class="text-center mb-5">
            <h1 class="display-4 fw-bold gradient-text mb-2">Clinician Lookup Gateway</h1>
            <p class="subtitle-text">Real-time NAMASTE & WHO ICD-11 (TM2) Interoperability</p>
        </div>

        <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="search-wrapper glass-panel p-2 mb-4 shadow-lg">
                        <div class="d-flex gap-2 align-items-center">
                            <input type="text" id="diseaseInput" class="form-control form-control-lg custom-input" placeholder="Enter Diagnosis" 
                            autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
                            <button type="button" id="clearSearchBtn" class="btn btn-sm text-muted d-none px-2" style="background: transparent; border: none; font-size: 1.2rem;" title="Clear search">✕</button>
                            <button class="btn icon-btn" id="micButton" title="Voice Search" type="button">🎙️</button>
                            <button class="btn btn-primary search-btn shadow-sm px-4 fw-bold" id="searchButton" type="button">Search</button>
                        </div>
                    </div>

                    <div id="result"></div>
                    <!-- API Integration Demo Area -->
                    <div id="emrIntegration"></div>
                </div>
            </div>
        </div>

        <!-- Command Palette Modal Overlay -->
        <div id="commandPalette" class="command-palette-overlay d-none">
            <div class="command-palette-box glass-panel p-3 shadow-lg">
                <div class="input-group mb-3">
                    <span class="input-group-text bg-transparent border-0 text-info">🔍</span>
                    <input type="text" id="commandInput" class="form-control form-control-lg custom-input shadow-none" placeholder="Type a command or search diagnosis (e.g., Go to Admin, Search Jvara)..." autofocus>
                    <button type="button" class="btn btn-sm btn-outline-secondary text-muted" id="closePalette">ESC</button>
                </div>
                <div class="command-list list-group list-group-flush bg-transparent" id="commandResults">
                    <div class="list-group-item bg-transparent text-muted small border-secondary">Quick Navigation & Actions</div>
                    <a href="index.html" class="list-group-item list-group-item-action bg-transparent text-light border-secondary">🩺 Switch to Clinician Portal</a>
                    <a href="admin.html" class="list-group-item list-group-item-action bg-transparent text-light border-secondary">🛡️ Switch to Hospital Admin & Compliance Portal</a>
                </div>
            </div>
        </div>

        <!-- Geo-Routing Specialists Modal (NEW) -->
        <div class="modal fade" id="clinicsModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content glass-panel border border-info" style="background: rgba(10, 15, 25, 0.95) !important;">
                    <div class="modal-header border-bottom border-secondary border-opacity-25">
                        <h5 class="modal-title fw-bold" style="color: rgba(0, 229, 255, 0.9);">📍 Nearby Traditional Specialists</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body" id="clinicsModalBody">
                        <!-- API results will be injected here -->
                    </div>
                </div>
            </div>
        </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Supabase JavaScript client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="/src/script.js"></script>
    <script>
    // Hide Admin navbar link if user is a Clinician
    window.addEventListener('DOMContentLoaded', () => {
        const role = localStorage.getItem('userRole');
        if (role === 'clinician') {
            const adminNavLinks = document.querySelectorAll('a[href="admin.html"]');
            adminNavLinks.forEach(link => link.style.display = 'none');
        }
    });
</script>
</body>
</html>
