<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MedBridge - Enterprise EMR Integration</title>
        <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='42' fill='%23050508' stroke='%2300e5ff' stroke-width='6'/><path d='M20 50 L35 50 L45 25 L60 75 L70 50 L80 50' stroke='%232979ff' stroke-width='8' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
        <link rel="stylesheet" href="style.css">
    </head>

    <body class="dark-theme">
        <div class="container mt-5 main-container">
            
            <div class="text-center mb-5 mt-4">
                <h1 class="display-5 fw-bold gradient-text mb-2">MedBridge EMR</h1>
                <p class="subtitle-text">Type or Speak a Diagnosis</p>
            </div>

            <div class="search-wrapper glass-panel p-2 mb-4 shadow-lg">
                <div class="d-flex gap-2 align-items-center">
                    <input type="text" id="diseaseInput" class="form-control form-control-lg custom-input" placeholder="Enter Diagnosis">
                    <button class="btn icon-btn" id="micButton" title="Voice Search" type="button">🎙️</button>
                    <button class="btn btn-primary search-btn shadow-sm px-4 fw-bold" id="searchButton" type="button">Search</button>
                </div>
            </div>

            <div id="result"></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
        <script src="script.js"></script>

    </body>
</html>
