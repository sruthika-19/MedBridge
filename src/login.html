<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedBridge - Secure Authentication</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Splash Screen Styles */
        #splashScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #050508;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.8s ease;
        }
        .splash-logo {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #00e5ff 0%, #2979ff 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: pulseGlow 1.5s infinite alternate;
        }
        @keyframes pulseGlow {
            0% { opacity: 0.6; transform: scale(0.98); }
            100% { opacity: 1; transform: scale(1.02); }
        }
        /* Smaller font inputs */
        .custom-input {
            font-size: 0.85rem !important;
        }
    </style>
</head>
<body class="dark-theme d-flex align-items-center justify-content-center" style="min-height: 100vh; overflow: hidden;">

    <!-- 🌟 Splash Screen (3 Seconds) -->
    <div id="splashScreen">
        <div class="splash-logo">MEDBRIDGE</div>
        <p class="text-muted small mt-2 tracking-widest" style="letter-spacing: 2px;">Initializing Interoperable EMR Gateway...</p>
    </div>

    <!-- Minimalist Login Wrapper -->
    <div class="login-wrapper glass-panel shadow-lg p-5" style="max-width: 450px; width: 100%;">
        
        <div class="text-center mb-4">
            <h3 class="fw-bold text-white mb-1">MedBridge Portal</h3>
            <p class="text-muted small">ABDM/ABHA Interoperable Workspace</p>
        </div>

        <!-- Role Toggle -->
        <div class="role-toggle d-flex mb-4">
            <button class="role-btn active flex-fill py-2" id="clinicianToggle" type="button">🩺 Clinician</button>
            <button class="role-btn flex-fill py-2" id="adminToggle" type="button">🛡️ Administrator</button>
        </div>

        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label text-muted small mb-1">Workspace Email</label>
                <input type="email" id="emailInput" class="form-control custom-input py-2" placeholder="name@facility.in" required>
            </div>
            <div class="mb-4">
                <label class="form-label text-muted small mb-1">Password</label>
                <div class="input-group">
                    <input type="password" id="passwordInput" class="form-control custom-input py-2" placeholder="••••••••" required>
                    <button class="btn btn-outline-secondary btn-sm" type="button" id="togglePassword" style="background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.15); color: #a0aec0;">👁️</button>
                </div>
            </div>
            
            <button type="submit" class="btn w-100 search-btn py-2 fw-bold mb-3">Sign in securely</button>
            
            <div class="text-center text-muted" style="font-size: 0.7rem;">
                <p class="mb-0 text-info">Live Supabase Auth • Secure Session Active</p>
            </div>
        </form>
    </div>

    <!-- Supabase Library & Logic -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Hide Splash Screen after 3 seconds
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splashScreen');
                splash.style.opacity = '0';
                setTimeout(() => splash.style.display = 'none', 800);
            }, 3000);
        });

        try {
            const supabaseUrl = 'https://xcqbkukofmswjxjuzyqw.supabase.co';
            const supabaseKey = 'sb_publishable_cj81k7F5rEs7YhRerW5H9w_UwaQIylv';
            const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

            let currentRole = 'clinician';
            const clinicianBtn = document.getElementById('clinicianToggle');
            const adminBtn = document.getElementById('adminToggle');

            clinicianBtn.addEventListener('click', () => {
                currentRole = 'clinician';
                clinicianBtn.classList.add('active');
                adminBtn.classList.remove('active');
            });

            adminBtn.addEventListener('click', () => {
                currentRole = 'admin';
                adminBtn.classList.add('active');
                clinicianBtn.classList.remove('active');
            });

            document.getElementById('togglePassword').addEventListener('click', function () {
                const passwordInput = document.getElementById('passwordInput');
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                this.textContent = type === 'password' ? '👁️' : '🔒';
            });

            document.getElementById('loginForm').addEventListener('submit', async function(event) {
                event.preventDefault(); 
                const submitBtn = event.target.querySelector('button[type="submit"]');
                const originalText = submitBtn.innerText;
                
                try {
                    const email = document.getElementById('emailInput').value;
                    const password = document.getElementById('passwordInput').value;
                    
                    submitBtn.innerText = 'Authenticating...';
                    submitBtn.disabled = true;

                    const { data, error } = await supabase.auth.signInWithPassword({
                        email: email,
                        password: password,
                    });

                    if (error) throw error;

                    localStorage.setItem('userRole', currentRole);

                    if (currentRole === 'clinician') {
                        window.location.href = 'index.html';
                    } else {
                        window.location.href = 'admin.html';
                    }

                } catch (authError) {
                    alert("Login Failed: " + authError.message);
                    submitBtn.innerText = originalText;
                    submitBtn.disabled = false;
                }
            });
        } catch (err) {
            console.error("Auth initialization error:", err);
        }
    </script>
</body>
</html>
